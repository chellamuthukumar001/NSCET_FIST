version: '3.8'

services:
  # 1. Primary Database: PostgreSQL 16 + pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusiq_secure_password_2026
      POSTGRES_DB: campusiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: campusiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. Core Business & Auth Backend: Node.js Express Server
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: campusiq-express-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:campusiq_secure_password_2026@postgres:5432/campusiq_db
      AI_SERVICE_URL: http://fastapi-ai:8000
      JWT_SECRET: campusiq_jwt_secret_nscet_theni
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # 4. AI / Hybrid RAG & NLP Microservice: Python FastAPI
  fastapi-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusiq-fastapi-ai
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:campusiq_secure_password_2026@postgres:5432/campusiq_db
      REDIS_URL: redis://redis:6379/0
      PII_SALT: nscet_immutable_pii_salt_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Institutional Web Portal: React + Vite
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: campusiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - fastapi-ai

volumes:
  pgdata:

